<!doctype html><html lang="uk"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
.cal{position:absolute;left:80px;right:80px;top:400px;height:820px;padding:32px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;height:100%}
.col{position:relative;border-radius:16px;background:var(--bg)}
.col h4{font:700 34px Manrope;color:var(--mut);text-align:center;padding:14px 0}
.ev{position:absolute;left:6px;right:6px;height:88px;border-radius:12px;background:var(--line);border-left:6px solid var(--acc)}
.tbl{position:absolute;left:80px;right:80px;top:380px;padding:16px 32px}
.row{display:grid;grid-template-columns:1.2fr 1fr .7fr;font:600 40px Manrope;color:var(--t2);padding:10px 0;border-bottom:2px solid var(--line)}
.row.h{color:var(--mut);font-size:32px}
.cards{position:absolute;left:80px;right:80px;top:900px;display:flex;flex-direction:column;gap:20px}
.cc{display:flex;align-items:center;gap:24px;padding:24px 32px;font:700 42px Manrope}
.cc i{width:20px;height:20px;border-radius:50%;background:var(--acc);flex:none}
.cc span{color:var(--mut);font-weight:600;margin-left:auto}
.arrow{position:absolute;left:50%;top:800px;margin-left:-30px;font:800 60px Montserrat;color:var(--acc)}
</style></head><body>
<div class="scene" id="cal"><div class="head"><div class="title" id="ct"></div></div>
 <div class="card cal"><div class="days" id="days"></div></div></div>
<div class="scene" id="imp"><div class="head"><div class="label">ІМПОРТ</div><div class="title">Перенесіть таблицю в систему <em>зараз</em></div></div>
 <div class="card tbl" id="tbl"></div><div class="arrow" id="ar">↓</div><div class="cards" id="cards"></div></div>
<div class="scene" id="ov"><div class="head"><div class="label">ВЕСНА</div><div class="title">Весну зустрінете з <em>порядком</em></div></div>
 <div class="shot" id="ovs" style="width:920px;height:820px"><img id="ovi" style="width:2384px;max-width:none;transform-origin:0 0" src="/home/user/detailflow/public/demo/overview.webp"></div></div>
<div id="endw"></div>
<script src="base.js"></script><script>
const DN=['Пн','Вт','Ср','Чт','Пт','Сб','Нд'];
// quiet events: [day,slot]; busy events fill slots 0..6
const quiet=[[1,1],[4,3]];const busy=[];for(let d=0;d<7;d++)for(let s=0;s<7;s++)if(!quiet.some(q=>q[0]==d&&q[1]==s))busy.push([d,s]);
busy.sort(()=>0);busy.forEach((b,i)=>b.push(((b[0]*7+b[1])*37)%busy.length));
$('days').innerHTML=DN.map((d,i)=>`<div class="col" id="col${i}"><h4>${d}</h4></div>`).join('');
const evs=[];[...quiet.map(q=>[...q,-1]),...busy].forEach((e,i)=>{const el=document.createElement('div');el.className='ev';el.style.top=(70+e[1]*96)+'px';$('col'+e[0]).appendChild(el);evs.push([el,e[2]])});
const rows=[['Іван К.','BMW X5','14:00'],['Олена','Audi Q7','15:30'],['Сергій','Kia Sportage','10:00'],['Марина','Toyota RAV4','12:00']];
$('tbl').innerHTML='<div class="row h"><div>Клієнт</div><div>Авто</div><div>Час</div></div>'+rows.map((r,i)=>`<div class="row" id="tr${i}"><div>${r[0]}</div><div>${r[1]}</div><div>${r[2]}</div></div>`).join('');
$('cards').innerHTML=rows.slice(0,3).map((r,i)=>`<div class="card cc" id="cd${i}"><i></i>${r[0]} · ${r[1]}<span>${r[2]}</span></div>`).join('');
$('endw').outerHTML=endHTML('Зима — час навести порядок');
const S={cal:[0,6.5],imp:[6.5,10],ov:[10,13],end:[13,17]};window.DURATION=17;
function render(t){fades(t,S);
 $('ct').innerHTML=t<3.1?'Листопад.<br>У студії <em>тихо</em>':'Навесні буде <em>завал</em>';
 $('ct').style.opacity=t<3.1?prog(t,0,0.5):prog(t,3.1,3.5);
 const N=busy.length;evs.forEach(([el,k])=>{if(k<0){el.style.opacity=prog(t,0.4,0.8);return}
  const a=3.3+k/N*2.6,p=prog(t,a,a+0.25);el.style.opacity=p;el.style.transform=`translateY(${(1-p)*-40}px)`});
 rise($('tbl'),t,6.6,0.5,30);rows.forEach((r,i)=>{if(i<3){const a=7.4+i*0.5;$('tr'+i).style.opacity=1-0.6*prog(t,a,a+0.3);rise($('cd'+i),t,a,0.4,-60)}});
 $('ar').style.opacity=prog(t,7.2,7.5);
 enter($('ovs'),t,10);{const z=prog(t,10.6,12.8);$('ovi').style.transform=`translate(${-40*z}px,${-90*z}px) scale(${0.386+0.234*z})`}
 endRender(t,13);}
window.render=render;render(0);
</script></body></html>
