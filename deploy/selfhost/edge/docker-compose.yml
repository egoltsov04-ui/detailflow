# Shared Caddy for the server (see Caddyfile). Start: docker compose up -d here.
# Each app stack runs without its own Caddy: docker compose -p detailflow-staging up -d --build api
name: detailflow-edge
services:
  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../app.caddy:/etc/caddy/app.caddy:ro
      - ${STAGING_DIST:-/srv/detailflow/dist}:/srv/staging:ro
      - /var/log/caddy:/var/log/caddy
      - caddy_data:/data
      - caddy_config:/config
    networks: [supabase-staging]
networks:
  supabase-staging:
    external: true
    name: supabase-staging_default
volumes:
  caddy_data:
  caddy_config:
